version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shomer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shomer
      POSTGRES_PASSWORD: shomer_password
      POSTGRES_DB: shomer_portal
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro  # Using Alembic migrations instead
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shomer -d shomer_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shomer_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: shomer_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --replica-read-only no --requirepass YtrewqQwerty123123Ytrewq
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YtrewqQwerty123123Ytrewq", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - shomer_network

  # FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: shomer_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - .env
    volumes:
      - ./app:/app/app:ro
      - upload_data:/app/uploads
      - logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://shomer:shomer_password@postgres:5432/shomer_portal
      - REDIS_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_BROKER_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:YtrewqQwerty123123Ytrewq@redis:6379/1
      - WEBSOCKET_URL=http://websocket:8080
      - DEBUG=False
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shomer_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for Background Tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: shomer_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./app:/app/app:ro
      - upload_data:/app/uploads
      - logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://shomer:shomer_password@postgres:5432/shomer_portal
      - REDIS_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_BROKER_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:YtrewqQwerty123123Ytrewq@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key}
      - SUREVIEW_USERNAME=${SUREVIEW_USERNAME}
      - SUREVIEW_PASSWORD=${SUREVIEW_PASSWORD}
      - SUREVIEW_API_URL=${SUREVIEW_API_URL}
      - SUREVIEW_LOGIN_URL=${SUREVIEW_LOGIN_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shomer_network

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: shomer_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./app:/app/app:ro
      - celery_beat_data:/var/lib/celery
      - logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://shomer:shomer_password@postgres:5432/shomer_portal
      - REDIS_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_BROKER_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:YtrewqQwerty123123Ytrewq@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key}
    depends_on:
      - redis
      - celery_worker
    networks:
      - shomer_network

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: shomer_websocket
    restart: unless-stopped
    command: python -m app.services.websocket_server
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app:ro
      - logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://shomer:shomer_password@postgres:5432/shomer_portal
      - REDIS_URL=redis://:YtrewqQwerty123123Ytrewq@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key}
      - WEBSOCKET_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shomer_network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Migration (run once)
  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: shomer_migration
    command: alembic upgrade head
    volumes:
      - ./app:/app/app:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    environment:
      - DATABASE_URL=postgresql://shomer:shomer_password@postgres:5432/shomer_portal
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shomer_network
    restart: "no"

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local
  celery_beat_data:
    driver: local
  logs:
    driver: local

# Networks
networks:
  shomer_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
